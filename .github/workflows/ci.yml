name: CI

# Lint + deterministic unit tests on every push and pull request.
# These never call an LLM (Ollama/OpenAI are not needed), so CI runs offline and fast.

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Unit tests (pytest)
        run: uv run pytest
